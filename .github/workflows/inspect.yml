name: Inspecionar ficha
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair estruturas importantes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          s=''.join(Path(f'app/part{i}.txt').read_text().strip() for i in range(7))
          html=gzip.decompress(base64.b64decode(s,validate=True)).decode('utf-8')
          pats=['g_hist','hist.push','function finish','finishWorkout','g_next','g_active','RIR','localStorage.setItem','showHistory','renderHistory']
          for p in pats:
              print('\n###',p)
              for m in list(re.finditer(re.escape(p),html,re.I))[:12]:
                  a=max(0,m.start()-500); b=min(len(html),m.end()+1200)
                  print(html[a:b].replace('\n',' ')[:1800])
                  print('\n---')
          PY
