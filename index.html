<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>Treino 3x — Garcia</title>
<style>
html,body{margin:0;background:#07101d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}
body{display:grid;place-items:center;min-height:100vh}
.box{text-align:center;padding:24px}.spin{font-size:38px}.muted{color:#9fb0c5;margin-top:8px;font-size:14px}
</style>
</head>
<body>
<div class="box"><div class="spin">🏋️</div><b>Carregando Treino 3x…</b><div class="muted">Abrindo sua ficha e sincronização.</div></div>
<script>
(async()=>{
  try{
    const r=await fetch('https://xvebkbtfvvcjmzjjxysk.supabase.co/functions/v1/treino-garcia-source',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar a ficha ('+r.status+')');
    const html=await r.text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="box"><div class="spin">⚠️</div><b>Não foi possível carregar a ficha.</b><div class="muted">'+String(e)+'</div></div>';
  }
})();
</script>
</body>
</html>
